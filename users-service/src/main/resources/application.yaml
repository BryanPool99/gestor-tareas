spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/users_db
    username: users_user
    password: users_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        #dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081